<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Costly POPIA mistakes cover">
  <defs>
    <linearGradient id="c4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2540"/><stop offset="1" stop-color="#3a1520"/></linearGradient>
    <pattern id="c4-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.07"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#c4-bg)"/>
  <rect width="800" height="500" fill="url(#c4-dots)"/>
  <circle cx="150" cy="120" r="150" fill="#d9534f" opacity="0.12"/>
  <!-- warning triangle -->
  <g transform="translate(400 250)">
    <path d="M0 -130 L118 82 A20 20 0 0 1 100 112 L-100 112 A20 20 0 0 1 -118 82 Z" fill="#ffffff"/>
    <path d="M0 -130 L118 82 A20 20 0 0 1 100 112 L-100 112 A20 20 0 0 1 -118 82 Z" fill="none" stroke="#f2b134" stroke-width="6"/>
    <rect x="-11" y="-52" width="22" height="86" rx="11" fill="#d9534f"/>
    <circle cx="0" cy="70" r="13" fill="#d9534f"/>
  </g>
  <!-- coin / rand hints -->
  <g transform="translate(150 330)">
    <circle cx="0" cy="0" r="42" fill="#f2b134"/>
    <text x="0" y="14" font-family="Segoe UI, sans-serif" font-size="42" font-weight="800" fill="#0f2540" text-anchor="middle">R</text>
  </g>
  <g transform="translate(650 150)">
    <circle cx="0" cy="0" r="30" fill="#e5a521"/>
    <text x="0" y="10" font-family="Segoe UI, sans-serif" font-size="30" font-weight="800" fill="#0f2540" text-anchor="middle">R</text>
  </g>
  <circle cx="700" cy="380" r="8" fill="#4fd1c0"/>
</svg>

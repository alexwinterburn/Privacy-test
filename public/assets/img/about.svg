<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Illustration of a trusted advisor protecting a business's data">
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#178576"/>
    </linearGradient>
    <linearGradient id="ab-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="ab-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a1a30" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="560" height="440" rx="20" fill="url(#ab-bg)"/>
  <circle cx="140" cy="120" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="440" cy="360" r="170" fill="#ffffff" opacity="0.05"/>

  <!-- central shield / trust -->
  <g filter="url(#ab-soft)">
    <path d="M280 90 L360 120 V210 C360 262 326 296 280 314 C234 296 200 262 200 210 V120 Z" fill="#0f2540"/>
    <path d="M247 200 l22 22 44 -52" fill="none" stroke="#f2b134" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- people nodes connected to shield -->
  <g opacity="0.95">
    <line x1="130" y1="200" x2="215" y2="200" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6"/>
    <line x1="430" y1="200" x2="345" y2="200" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6"/>
    <line x1="280" y1="330" x2="280" y2="360" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6"/>
  </g>
  <g filter="url(#ab-soft)">
    <circle cx="104" cy="200" r="34" fill="url(#ab-card)"/>
    <circle cx="104" cy="190" r="11" fill="#178576"/>
    <path d="M86 216a18 18 0 0 1 36 0z" fill="#178576"/>
  </g>
  <g filter="url(#ab-soft)">
    <circle cx="456" cy="200" r="34" fill="url(#ab-card)"/>
    <circle cx="456" cy="190" r="11" fill="#1f9e8f"/>
    <path d="M438 216a18 18 0 0 1 36 0z" fill="#1f9e8f"/>
  </g>
  <g filter="url(#ab-soft)">
    <circle cx="280" cy="392" r="34" fill="url(#ab-card)"/>
    <circle cx="280" cy="382" r="11" fill="#0f2540"/>
    <path d="M262 408a18 18 0 0 1 36 0z" fill="#0f2540"/>
  </g>

  <circle cx="380" cy="90" r="6" fill="#f2b134"/>
  <circle cx="170" cy="330" r="5" fill="#4fd1c0"/>
</svg>

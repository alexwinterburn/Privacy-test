<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Illustration of a four-step compliance roadmap">
  <defs>
    <linearGradient id="ap-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2540"/><stop offset="1" stop-color="#1d3f63"/>
    </linearGradient>
    <linearGradient id="ap-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f9e8f"/><stop offset="1" stop-color="#f2b134"/>
    </linearGradient>
    <filter id="ap-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#04101f" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="560" height="440" rx="20" fill="url(#ap-bg)"/>
  <circle cx="470" cy="90" r="150" fill="#ffffff" opacity="0.04"/>

  <!-- winding path -->
  <path d="M80 360 C160 360 150 250 240 250 C330 250 320 150 410 150 C470 150 480 110 480 90"
        fill="none" stroke="url(#ap-line)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- step nodes -->
  <g filter="url(#ap-soft)">
    <circle cx="80" cy="360" r="30" fill="#1f9e8f"/><text x="80" y="368" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <circle cx="240" cy="250" r="30" fill="#178576"/><text x="240" y="258" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <circle cx="410" cy="150" r="30" fill="#0f2540" stroke="#2b4a6e" stroke-width="2"/><text x="410" y="158" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <circle cx="480" cy="72" r="26" fill="#f2b134"/><path d="M470 72l7 7 13 -15" fill="none" stroke="#0f2540" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- little labels -->
  <g font-family="Segoe UI, sans-serif" fill="#c3d0e0" font-size="14" font-weight="600">
    <text x="120" y="365">Assess</text>
    <text x="280" y="255">Plan</text>
    <text x="450" y="155">Build</text>
  </g>
  <text x="512" y="76" font-family="Segoe UI, sans-serif" fill="#f2b134" font-size="14" font-weight="700">Compliant</text>
</svg>

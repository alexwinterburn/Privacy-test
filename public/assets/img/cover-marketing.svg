<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Direct marketing and consent cover">
  <defs>
    <linearGradient id="c3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f9e8f"/><stop offset="1" stop-color="#16324f"/></linearGradient>
    <pattern id="c3-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.07"/></pattern>
    <linearGradient id="c3-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c453"/><stop offset="1" stop-color="#e5a521"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#c3-bg)"/>
  <rect width="800" height="500" fill="url(#c3-dots)"/>
  <circle cx="650" cy="380" r="150" fill="#ffffff" opacity="0.05"/>
  <!-- envelope -->
  <g transform="translate(280 140)">
    <rect x="0" y="0" width="240" height="170" rx="18" fill="#ffffff"/>
    <path d="M14 20 L120 104 L226 20" fill="none" stroke="#cfdae8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- opt-in check bubble -->
    <circle cx="210" cy="150" r="40" fill="url(#c3-gold)"/>
    <path d="M192 150l12 12 22 -26" stroke="#0f2540" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- signal arcs -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
    <path d="M170 150 a40 40 0 0 0 0 60"/>
    <path d="M150 135 a64 64 0 0 0 0 90"/>
  </g>
  <circle cx="150" cy="380" r="9" fill="#f2b134"/>
  <circle cx="620" cy="120" r="7" fill="#4fd1c0"/>
</svg>

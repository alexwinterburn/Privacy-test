# ─────────────────────────────────────────────────────────────
# Decap CMS configuration — the admin panel at /admin
#
# AUTH: this uses Netlify's "Git Gateway". One-time setup in Netlify:
#   1. Site settings → Identity → Enable Identity
#   2. Identity → Services → Git Gateway → Enable
#   3. Identity → Registration → set to "Invite only", then invite yourself
# Then log in at https://YOURDOMAIN/admin/
#
# Prefer to skip Netlify Identity and use GitHub directly? Comment out the
# git-gateway block below and use the "github" backend instead (needs a GitHub
# OAuth app / OAuth provider — see README).
#
# IMPORTANT: set `branch` to the branch your live site deploys from.
# ─────────────────────────────────────────────────────────────
backend:
  name: git-gateway
  branch: main

# Lets you preview the CMS locally with `npm run dev` (no cloud login needed)
# by visiting http://localhost:8080/admin/ — see README.
local_backend: true

media_folder: "src/assets/img/uploads"   # where uploaded images are saved in the repo
public_folder: "/assets/img/uploads"      # the path used in the built site

publish_mode: simple

collections:
  - name: "blog"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Write and publish POPIA articles. They appear automatically on the blog."
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "blog-{{slug}}.html"
    summary: "{{title}}  ·  {{category}}  ·  {{date | date('D MMM YYYY')}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Publish date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - name: "category"
        label: "Category"
        widget: "select"
        options: ["Compliance", "Roles", "Risk", "Marketing", "Security", "Guidance"]
        default: "Guidance"
      - { name: "summary", label: "Summary (intro shown under the title & on cards)", widget: "text" }
      - { name: "cover", label: "Cover image", widget: "image", default: "/assets/img/cover-checklist.svg", hint: "Shown as the article banner and on blog cards. Use a wide image (about 800×500)." }
      - { name: "coverAlt", label: "Cover image description (for accessibility/SEO)", widget: "string", required: false }
      - { name: "tags", label: "Tags", widget: "list", required: false, default: ["POPIA"] }
      - { name: "featured", label: "Feature at top of blog?", widget: "boolean", required: false, default: false }
      - name: "description"
        label: "SEO meta description"
        widget: "text"
        hint: "1–2 sentences shown in Google & social previews. Keep under ~155 characters."
      - { name: "keywords", label: "SEO keywords (comma-separated)", widget: "string", required: false }
      - { name: "body", label: "Article body", widget: "markdown" }
